default:
  target: dev
  outputs:
    dev:
      type: athena
      s3_staging_dir: s3://ons-dev-dg-00-stage/athena-results/dev/
      region_name: us-east-1
      catalog_name: AwsDataCatalog      # ← Nome do Data Catalog (geralmente AwsDataCatalog)
      database: analytics_dev            # ← Nome do DATABASE no Glue (DEVE EXISTIR!)
      schema: dbt_dev                    # ← Nome do SCHEMA/DATABASE no Athena
      work_group: primary
      threads: 4
      aws_profile_name: null
      
    prod:
      type: athena
      s3_staging_dir: s3://ons-dev-dg-00-stage/athena-results/prod/
      region_name: us-east-1
      catalog_name: AwsDataCatalog
      database: analytics_prod           # ← DEVE EXISTIR no Glue!
      schema: dbt_prod
      work_group: primary
      threads: 8
      aws_profile_name: null
      poll_interval: 1.0
      num_retries: 3